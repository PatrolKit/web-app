packages:
  - 'apps/*'

# Which dependencies may run install scripts (pnpm 11). Everything else is
# refused: a compromised package can't run code just by being installed.
allowBuilds:
  sharp: true
  argon2: true
  prisma: true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  cpu-features: true
  protobufjs: true
  ssh2: true
  # A funding message, nothing more.
  '@nestjs/core': false
